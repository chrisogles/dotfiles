# Seamless Ctrl-h/j/k/l between tmux panes and nvim splits. This is the
# vim-tmux-navigator snippet rather than the plugin, so no TPM is needed —
# Omarchy's tmux config has no plugin manager and doesn't need one.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -N "Focus pane left (vim-aware)" -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -N "Focus pane down (vim-aware)" -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -N "Focus pane up (vim-aware)" -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -N "Focus pane right (vim-aware)" -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Ctrl-l now moves panes, so keep clear-screen on prefix + Ctrl-l
bind -N "Clear screen" C-l send-keys C-l

# Previous/next window with Alt-Shift-h/l (Omarchy also binds Alt-Left/Right)
bind -N "Previous window" -n M-H previous-window
bind -N "Next window" -n M-L next-window

# Repeatable pane resize with prefix + Alt-h/j/k/l
bind -N "Resize pane left" -r M-h resize-pane -L 5
bind -N "Resize pane down" -r M-j resize-pane -D 5
bind -N "Resize pane up" -r M-k resize-pane -U 5
bind -N "Resize pane right" -r M-l resize-pane -R 5

# Dim inactive panes
set -g window-style 'fg=colour240,bg=colour233'
set -g window-active-style 'fg=colour255,bg=terminal'
