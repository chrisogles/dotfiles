# --- tmux config (shared: Ubuntu box + MacBook Pro) ---

# PlugIn Managers
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @continuum-restore 'on'
# Snapshot every 5 min rather than the 15 min default — on a flaky link the
# cost of a lost snapshot is higher than the cost of writing one more often.
set -g @continuum-save-interval '5'
set -g @resurrect-strategy-nvim 'session'
# Restore what was on screen, not just the pane layout — a reboot otherwise
# gives you back empty panes with no record of what you were reading.
set -g @resurrect-capture-pane-contents 'on'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Catppuccin status bar config (must be before TPM run)
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_status_icon_enable "yes"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_status_modules_right "directory session date_time"

# Prefix: Ctrl-Space instead of the default Ctrl-b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind -n M-H previous-window
bind -n M-L next-window

# Touch/trackpad scrolling and pane selection
set -g mouse on

# Let Neovim (and other apps) see focus in/out events, needed for 'autoread'
set -g focus-events on

# Default shell: zsh where available, bash otherwise (this box stays on bash)
if-shell "command -v zsh" \
  "set -g default-shell /bin/zsh" \
  "set -g default-shell /bin/bash"

# True color + sane terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g set-clipboard on

# Big scrollback (network drops shouldn't cost you history)
set -g history-limit 50000

# Start windows/panes at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster escape recognition (helps vi-mode responsiveness over SSH)
set -sg escape-time 10

# Vi-style copy mode (works well with a bluetooth keyboard's arrow/hjkl keys)
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Vi-style pane navigation (requires prefix first, so it never collides
# with bash readline's own Ctrl-h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with Option + hjkl (repeatable)
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Easier splits, keep current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Minimal, informative status bar
set -g status-position bottom
set -g status-style bg=default
set -g status-left "#[bold]#S "
set -g status-right "%H:%M "
set -g status-justify centre
setw -g window-status-current-style bold

# Don't let one dead ssh connection linger as a stuck client
set -g destroy-unattached off

run '~/.tmux/plugins/tpm/tpm'

# Override plugin defaults (must be after TPM)
set -g status 2
set -g status-format[1] ""
if-shell -F "#{>=:#{version},3.3}" \
  "set -g message-line 1"

set -g automatic-rename off
